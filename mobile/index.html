<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>饭点小站</title>
<style>
:root {
  --bg: #F5F6FA; --card: #FFFFFF; --text: #2D3436; --text2: #999;
  --border: #F0F0F3; --primary: #FF6B35; --primary-light: #FF8C5A;
  --tag-sichuan-bg: #FFF3EE; --tag-sichuan-border: #FFD4C2;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

.header { background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; padding:18px 20px; text-align:center; position:sticky; top:0; z-index:10;
  box-shadow:0 2px 12px rgba(255,107,53,0.15); display:flex; align-items:center; justify-content:center; }
.header h1 { font-size:20px; letter-spacing:2px; font-weight:700; }
.header .back-btn { position:absolute; left:0; top:50%;transform:translateY(-50%); background:none; border:none; color:rgba(255,255,255,0.85); font-size:15px; cursor:pointer; padding:8px 12px; font-family:inherit; letter-spacing:1px; }

.page { display:none; }
.page.active { display:block; }

/* ===== 欢迎横幅 ===== */
.welcome-banner {
  background: linear-gradient(135deg, #FF6B35, #FF8C5A);
  color: #fff;
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.welcome-banner::after {
  content: '🍜';
  position: absolute;
  right: 20px; top: 50%;
  transform: translateY(-50%);
  font-size: 56px;
  opacity: 0.2;
}
.welcome-greeting { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.welcome-date { font-size: 13px; opacity: 0.75; margin-top: 6px; letter-spacing: 1px; }

/* ===== 快捷统计 ===== */
.quick-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 20px 16px 8px;
  max-width: 400px;
  margin: 0 auto;
}
.stat-item {
  text-align: center;
  flex: 1;
}
.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
}
.stat-label {
  font-size: 11px;
  color: var(--text2);
  margin-top: 2px;
  letter-spacing: 1px;
}

/* ===== 导航首页 ===== */
.nav-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:16px 16px 32px; max-width:400px; margin:0 auto; }
.nav-grid .nav-card:last-child:nth-child(odd) { grid-column:1/-1; max-width:50%; margin:0 auto; }
.nav-card {
  background: var(--card);
  text-align: center;
  padding: 24px 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  border-radius: 16px;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.nav-card:active { transform: scale(0.96); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
.nav-icon-circle {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-icon-circle svg { width: 28px; height: 28px; }
.nav-icon-circle.menu   { background: linear-gradient(135deg, #FFF3EE, #FFE8DD); }
.nav-icon-circle.menu   svg { stroke: #FF6B35; }
.nav-icon-circle.order  { background: linear-gradient(135deg, #E8F8EE, #D4F0E0); }
.nav-icon-circle.order  svg { stroke: #27AE60; }
.nav-icon-circle.daily  { background: linear-gradient(135deg, #FFF8EE, #FFEEDD); }
.nav-icon-circle.daily  svg { stroke: #E5A010; }
.nav-icon-circle.shop   { background: linear-gradient(135deg, #EEF3FF, #DDE5FF); }
.nav-icon-circle.shop   svg { stroke: #4A90D9; }
.nav-icon-circle.fb     { background: linear-gradient(135deg, #EEF8F8, #DDF0F0); }
.nav-icon-circle.fb     svg { stroke: #0EA5A0; }
.nav-card .label { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
.nav-card .hint { font-size: 11px; color: var(--text2); }

/* 菜单页 */
.menu-list { padding:16px 14px; display:flex; flex-direction:column; }
.menu-list .day-card + .day-card { margin-top:14px; }
.day-card { background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
.day-header { background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
.day-card.holiday .day-header { background:linear-gradient(135deg,#B0B0B0,#C0C0C0); }
.day-name { font-weight:700; font-size:15px; letter-spacing:1px; }
.day-date { font-size:12px; opacity:0.75; }
.day-body { padding:16px; }
.dish-section { margin-bottom:14px; }
.dish-section:last-child { margin-bottom:0; }
.section-label { font-size:12px; font-weight:700; color:var(--primary); margin-bottom:8px; padding-left:2px; letter-spacing:1px; }
.dish-row { font-size:14px; padding:6px 0; display:flex; justify-content:space-between; align-items:center; }
.dish-info { display:flex; align-items:center; gap:6px; }
.dish-rating { display:flex; align-items:center; gap:2px; margin-left:6px; }
.dish-rating .stars { color:var(--primary); font-size:12px; letter-spacing:1px; }
.dish-rating .rating-num { color:var(--text2); font-size:11px; }
.dish-tag { font-size:10px; padding:3px 10px; border-radius:6px; letter-spacing:1px; flex-shrink:0; margin-left:8px; }
.tag-sichuan { background:var(--tag-sichuan-bg); color:var(--primary); border:1px solid var(--tag-sichuan-border); }
.tag-other { background:#F5F6FA; color:#888; border:1px solid #E8E8ED; }
.divider { border:none; border-top:1px solid var(--border); margin:12px 0; }
.holiday-notice { text-align:center; padding:28px; color:var(--text2); font-size:15px; letter-spacing:1px; }
.week-nav-row { display:flex; align-items:center; justify-content:center; gap:16px; padding:14px 16px 8px; }
.week-nav-row span { font-weight:700; letter-spacing:1px; font-size:14px; }
.week-nav-row button { width:32px;height:32px;border:1px solid #E8E8ED;background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px; }
.btn-refresh { border:1px solid #E8E8ED;background:var(--bg);color:var(--text);padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:1px;border-radius:8px; }
.menu-summary { display:flex; justify-content:center; gap:18px; padding:4px 16px 10px; font-size:11px; color:var(--text2); letter-spacing:1px; }
.menu-summary b { color:var(--primary); }

/* ===== 每日菜单 + 评分 ===== */
.daily-date-label { text-align:center; padding:14px 16px 6px; font-size:14px; font-weight:700; color:var(--primary); letter-spacing:1px; }
.daily-menu-list { padding:0 14px 24px; display:flex; flex-direction:column; gap:10px; }
.daily-dish-card { background:var(--card); padding:14px 16px; border-radius:14px; box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; }
.daily-dish-info { flex:1; }
.daily-dish-name { font-size:15px; font-weight:600; }
.daily-dish-tag { font-size:10px; padding:2px 8px; border-radius:4px; letter-spacing:1px; }
.daily-dish-meta { display:flex; align-items:center; gap:8px; margin-top:4px; }
.daily-dish-avg { font-size:12px; color:var(--text2); }
.daily-rating-area { display:flex; align-items:center; gap:2px; flex-shrink:0; }
.daily-star { font-size:24px; color:#E8E8ED; cursor:pointer; transition:color 0.15s; line-height:1; padding:2px; }
.daily-star.active { color:#FFB347; }
.daily-star:active { transform:scale(1.2); }
.daily-rating-hint { font-size:11px; color:var(--text2); text-align:right; margin-top:2px; }
.daily-empty { text-align:center; padding:60px 20px; color:var(--text2); }

/* 意见箱 */
.fb-form { padding:0 16px; }
.fb-form input,.fb-form select,.fb-form textarea { width:100%; padding:12px; border:1px solid #E8E8ED; font-size:14px; margin-bottom:12px; background:var(--card); color:var(--text); font-family:inherit; border-radius:10px; }
.fb-form textarea { height:120px; resize:vertical; }
.fb-form input:focus,.fb-form select:focus,.fb-form textarea:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 3px rgba(255,107,53,0.1); }
.btn-submit { width:100%; padding:14px; background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; border:none; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:1px; font-family:inherit; border-radius:10px; }
.btn-submit:active { opacity:0.85; }
.fb-list { padding:0 16px; display:flex; flex-direction:column; gap:10px; }
.fb-card { background:var(--card); padding:14px; box-shadow:var(--shadow); border-radius:12px; }
.fb-card .meta { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:6px; }
.fb-card .content { font-size:14px; margin-bottom:6px; }
.fb-card .reply { background:rgba(255,107,53,0.05); padding:8px 12px; font-size:13px; color:var(--text2); border-left:3px solid var(--primary); border-radius:0 8px 8px 0; }
.badge { display:inline-block; padding:2px 8px; font-size:10px; letter-spacing:1px; border-radius:4px; }
.badge-pending { background:#FFF3EE; color:#E55A2B; border:1px solid #FFD4C2; }
.badge-replied { background:#E8F8EE; color:#27AE60; border:1px solid #B8E6CC; }

/* 占位页 */
.placeholder { text-align:center; padding:80px 20px; }
.placeholder .icon { font-size:60px; display:block; margin-bottom:16px; }
.placeholder .msg { font-size:16px; color:var(--text2); letter-spacing:1px; }

.toast { position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#2D3436;color:#fff;padding:10px 24px;font-size:13px;z-index:99;opacity:0;transition:opacity 0.3s;pointer-events:none;letter-spacing:1px;border-radius:8px; }
.toast.show { opacity:1; }
.empty { text-align:center; padding:40px; color:var(--text2); letter-spacing:1px; }

/* 弹窗 */
.modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s; }
.modal-overlay.show { opacity:1;pointer-events:auto; }
.modal-card { background:var(--card);width:280px;padding:24px 20px 20px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.15);border-radius:16px; }
.modal-card h3 { font-size:16px;color:var(--primary);margin-bottom:14px;letter-spacing:1px; }
.modal-card input { width:100%;padding:10px 12px;border:1px solid #E8E8ED;font-size:14px;text-align:center;background:var(--card);font-family:inherit;letter-spacing:1px;border-radius:8px; }
.modal-card input:focus { border-color:var(--primary);outline:none; }
.modal-card .btn-confirm { width:100%;margin-top:12px;padding:10px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;font-family:inherit;border-radius:10px; }
</style>
</head>
<body>

<!-- 导航首页 -->
<div id="page-home" class="page active">
  <div class="welcome-banner">
    <div class="welcome-greeting" id="welcomeGreeting">中午好</div>
    <div class="welcome-date" id="welcomeDate"></div>
  </div>

  <div class="quick-stats">
    <div class="stat-item">
      <div class="stat-num" id="statDays">5</div>
      <div class="stat-label">本周供餐天数</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statDishes">--</div>
      <div class="stat-label">本周菜品数</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statSichuan">--</div>
      <div class="stat-label">川菜占比</div>
    </div>
  </div>

  <div class="nav-grid">
    <div class="nav-card" onclick="goPage('menu')">
      <div class="nav-icon-circle menu"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg></div>
      <span class="label">本周菜单</span>
      <span class="hint">每日4荤3素1汤1面</span>
    </div>
    <div class="nav-card" onclick="goPage('today')">
      <div class="nav-icon-circle order"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg></div>
      <span class="label">每日预订</span>
      <span class="hint">预订今日主食</span>
    </div>
    <div class="nav-card" onclick="goPage('daily')">
      <div class="nav-icon-circle daily"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
      <span class="label">菜品评分</span>
      <span class="hint">今日菜品 · 打分评价</span>
    </div>
    <div class="nav-card" onclick="goPage('shop')">
      <div class="nav-icon-circle shop"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div>
      <span class="label">商品订购</span>
      <span class="hint">敬请期待</span>
    </div>
    <div class="nav-card" onclick="goPage('feedback')">
      <div class="nav-icon-circle fb"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg></div>
      <span class="label">意见箱</span>
      <span class="hint">投诉 · 建议 · 表扬</span>
    </div>
  </div>
</div>

<!-- 每日预订 -->
<div id="page-today" class="page">
  <header class="header">
    <button class="back-btn" onclick="goPage('home')">&#12296; 首页</button>
    <h1>每日预订</h1>
  </header>
  <div style="text-align:center;padding:8px;font-weight:700;letter-spacing:1px;color:var(--text2);" id="todayLabel"></div>
  <div style="text-align:center;padding:0 14px 8px;font-size:11px;color:var(--text2);" id="deadlineInfo">
    <span id="deadlineText"></span>
  </div>
  <div style="padding:0 14px;" id="todayForm" class="fb-form">
    <div id="todayContent"></div>
    <button class="btn-submit" id="orderNextBtn" onclick="showNameStep()" style="display:none;">下一步</button>
    <div id="orderResult" style="text-align:center;padding:16px;color:var(--primary);font-weight:700;display:none;"></div>
  </div>
  <div style="padding:16px 14px;display:flex;gap:10px;">
    <input type="text" id="searchOrderName" placeholder="输入姓名查我的预订" style="flex:1;padding:10px;border:1px solid #E8E8ED;font-size:14px;background:var(--card);color:var(--text);font-family:inherit;border-radius:10px;">
    <button class="btn-submit" style="width:auto;padding:8px 14px;" onclick="loadMyOrders()">查询</button>
  </div>
  <div id="myOrdersList" style="padding:0 14px;"></div>
</div>

<!-- 每日菜单（评分） -->
<div id="page-daily" class="page">
  <header class="header">
    <button class="back-btn" onclick="goPage('home')">&#12296; 首页</button>
    <h1>每日菜单</h1>
  </header>
  <div class="daily-date-label" id="dailyDateLabel"></div>
  <div class="daily-menu-list" id="dailyMenuList"></div>
</div>

<!-- 本周菜单 -->
<div id="page-menu" class="page">
  <header class="header">
    <button class="back-btn" onclick="goPage('home')">&#12296; 首页</button>
    <h1>本周菜单</h1>
  </header>
  <div class="week-nav-row">
    <span id="weekLabel"></span>
  </div>
  <div class="menu-summary" id="menuSummary"></div>
  <div class="menu-list" id="menuList"></div>
</div>

<!-- 意见箱 -->
<div id="page-feedback" class="page">
  <header class="header">
    <button class="back-btn" onclick="goPage('home')">&#12296; 首页</button>
    <h1>意见箱</h1>
  </header>
  <div style="padding-top:16px;">
    <div class="fb-form">
      <input type="text" id="fbNickname" placeholder="你的昵称（选填）">
      <select id="fbType"><option value="suggestion">建议</option><option value="complaint">投诉</option><option value="praise">表扬</option></select>
      <textarea id="fbContent" placeholder="请描述你的建议或投诉..."></textarea>
      <button class="btn-submit" onclick="submitFeedback()">提交反馈</button>
    </div>
    <div style="padding:16px;display:flex;gap:10px;">
      <input type="text" id="fbSearchNick" placeholder="输入昵称查我的反馈" style="flex:1;padding:10px;border:1px solid #E8E8ED;font-size:14px;background:var(--card);color:var(--text);font-family:inherit;border-radius:10px;">
      <button class="btn-submit" style="width:auto;padding:8px 16px;" onclick="loadMyFeedbacks()">查询</button>
    </div>
    <div class="fb-list" id="fbList"></div>
  </div>
</div>

<!-- 商品订购（占位） -->
<div id="page-shop" class="page">
  <header class="header">
    <button class="back-btn" onclick="goPage('home')">&#12296; 首页</button>
    <h1>商品订购</h1>
  </header>
  <div class="placeholder">
    <span class="icon">🛒</span>
    <span class="msg">功能开发中，敬请期待</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="nameModal">
  <div class="modal-card">
    <h3>确认预订</h3>
    <input type="text" id="orderName" placeholder="请输入你的姓名">
    <button class="btn-confirm" onclick="submitOrder()">确认预订</button>
  </div>
</div>

<script>
const API = location.origin;

// 评分 → 星级展示
function ratingToStars(rating) {
  if (rating == null) return '';
  const full = Math.floor(rating);
  const half = rating - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '☆' : '') + '☆'.repeat(empty);
}

function getMonday(d){const n=new Date(d);const day=n.getDay();const diff=n.getDate()-day+(day===0?-6:1);n.setDate(diff);return n;}
function weekLabel(d){const dn=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dayNum=dn.getUTCDay()||7;dn.setUTCDate(dn.getUTCDate()+4-dayNum);const ys=new Date(Date.UTC(dn.getUTCFullYear(),0,1));const w=Math.ceil((((dn-ys)/86400000)+1)/7);return d.getFullYear()+'年 第'+w+'周';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// 欢迎语 & 日期
function updateWelcome(){
  const now = new Date();
  const h = now.getHours();
  let greeting = '早上好';
  if (h >= 6 && h < 12) greeting = '早上好 ☀️';
  else if (h >= 12 && h < 14) greeting = '中午好 🌤️';
  else if (h >= 14 && h < 18) greeting = '下午好 🌿';
  else if (h >= 18 && h < 21) greeting = '晚上好 🌙';
  else greeting = '夜深了 🌃';
  document.getElementById('welcomeGreeting').textContent = greeting;

  const weekDays = ['日','一','二','三','四','五','六'];
  const dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 星期' + weekDays[now.getDay()];
  document.getElementById('welcomeDate').textContent = dateStr;
}

// 首页统计
async function loadHomeStats(){
  try {
    const monday = getMonday(new Date());
    const wk = [monday.getFullYear(),String(monday.getMonth()+1).padStart(2,'0'),String(monday.getDate()).padStart(2,'0')].join('-');
    const res = await fetch(API+'/api/menus?week_key='+wk);
    const data = await res.json();
    if (data.days) {
      let total = 0, sichuan = 0, wdays = 0;
      data.days.forEach(day => {
        if (day.is_holiday || !day.dishes) return;
        wdays++;
        const d = day.dishes;
        [d.bigMeat, d.otherMeat, d.vegetables, [d.soup, d.noodle]].flat().filter(Boolean).forEach(dish => {
          total++; if (dish.cuisine === '川菜') sichuan++;
        });
      });
      document.getElementById('statDays').textContent = wdays;
      document.getElementById('statDishes').textContent = total;
      document.getElementById('statSichuan').textContent = Math.round(sichuan/total*100) + '%';
    }
  } catch(e) {}
}

// 页面导航
function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if (name === 'home') { updateWelcome(); loadHomeStats(); }
  if (name === 'menu') loadMenu();
  if (name === 'daily') loadDailyMenu();
  if (name === 'today') loadToday();
  window.scrollTo(0,0);
}

// 每日预订
let todayItems=[];

async function loadToday(){
  const now=new Date();
  const dow=now.getDay();
  const hour=now.getHours();
  const todayStr=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
  const dayNames=['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('todayLabel').textContent=todayStr+' '+dayNames[dow];
  document.getElementById('orderNextBtn').style.display='none';
  document.getElementById('orderResult').style.display='none';
  document.getElementById('nameModal').classList.remove('show');
  document.getElementById('myOrdersList').innerHTML='';

  // 时间提示
  let deadlineHTML='';
  if(hour>=14&&hour<15)deadlineHTML='预订已截止（每日14:00前），<span style="color:var(--primary);">15:00前可取消已有预订</span>';
  else if(hour>=15)deadlineHTML='预订已截止，取消也截止了';
  else deadlineHTML='预订截止 <b style="color:var(--primary);">14:00</b> · 取消截止 <b>15:00</b>';
  document.getElementById('deadlineText').innerHTML=deadlineHTML;

  if(dow===0||dow===6){
    document.getElementById('todayContent').innerHTML='<div class="empty">周末不供应主食</div>';
    document.getElementById('searchOrderName').value='';
    return;
  }
  try{
    const res=await fetch(API+'/api/daily-staples');
    const data=await res.json();
    const wd=dow-1;
    todayItems=data[wd]||[];
    if(!todayItems.length){
      document.getElementById('todayContent').innerHTML='<div class="empty">今日暂无主食供应</div>';
      document.getElementById('searchOrderName').value='';
      return;
    }
    if(hour<14){
      document.getElementById('orderNextBtn').style.display='block';
    }
    document.getElementById('todayContent').innerHTML=
      `<div class="day-card"><div class="day-header">今日预订</div><div class="day-body">`+
      todayItems.map((s,i)=>`<div class="dish-row" style="font-size:15px;padding:8px 0;">
        <span>${s.name}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <button onclick="chgQty(${i},-1)" style="width:28px;height:28px;border:1px solid #E8E8ED;background:var(--bg);font-size:16px;cursor:pointer;line-height:1;border-radius:6px;" ${hour>=14?'disabled':''}>-</button>
          <span id="qty${i}" style="min-width:20px;text-align:center;">0</span>
          <button onclick="chgQty(${i},1)" style="width:28px;height:28px;border:1px solid #E8E8ED;background:var(--bg);font-size:16px;cursor:pointer;line-height:1;border-radius:6px;" ${hour>=14?'disabled':''}>+</button>
        </span>
      </div>`).join('')+
      `</div></div>
      <div style="text-align:center;padding:12px 0;font-size:11px;color:var(--text2);line-height:1.8;">
        预订截止：每日 <b>14:00</b>（下午2点）<br>
        取消截止：每日 <b>15:00</b>（下午3点）
      </div>`;
  }catch(e){document.getElementById('todayContent').innerHTML='<div class="empty">加载失败</div>';}
}

function chgQty(i,d){
  const el=document.getElementById('qty'+i);
  let v=parseInt(el.textContent)+d;
  if(v<0)v=0;
  el.textContent=v;
}

function showNameStep(){
  const items=[];
  todayItems.forEach((s,i)=>{
    const qty=parseInt(document.getElementById('qty'+i).textContent);
    if(qty>0)items.push(s.name+' x'+qty);
  });
  if(!items.length){toast('请选择数量');return;}
  document.getElementById('nameModal').classList.add('show');
  document.getElementById('orderName').value='';
  document.getElementById('orderName').focus();
}

async function submitOrder(){
  const name=document.getElementById('orderName').value.trim();
  if(!name){toast('请输入姓名');return;}
  const items=[];
  todayItems.forEach((s,i)=>{
    const qty=parseInt(document.getElementById('qty'+i).textContent);
    if(qty>0)items.push({staple_id:s.id,quantity:qty});
  });
  const res=await fetch(API+'/api/daily-orders?customer_name='+encodeURIComponent(name)+'&orders='+encodeURIComponent(JSON.stringify(items)),{method:'POST'});
  const data=await res.json();
  document.getElementById('nameModal').classList.remove('show');
  if(!res.ok){
    toast(data.detail||'预订失败');
    return;
  }
  document.getElementById('orderResult').style.display='block';
  document.getElementById('orderResult').textContent='预订成功！';
  setTimeout(()=>{document.getElementById('orderResult').style.display='none';},3000);
  document.getElementById('searchOrderName').value=name;
  loadMyOrders();
}

async function loadMyOrders(){
  const name=document.getElementById('searchOrderName').value.trim();
  if(!name){toast('请输入姓名');return;}
  const todayStr=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-');
  const res=await fetch(API+'/api/daily-orders/mine?customer_name='+encodeURIComponent(name)+'&date_str='+todayStr);
  const items=await res.json();
  const hour=new Date().getHours();
  const canCancel=hour<15;
  if(!items.length){
    document.getElementById('myOrdersList').innerHTML='<div class="empty" style="padding:20px;">没有找到今天的预订</div>';
    return;
  }
  document.getElementById('myOrdersList').innerHTML=
    `<div style="font-size:13px;font-weight:700;color:var(--primary);margin:8px 0 6px;letter-spacing:1px;">${name} 的预订</div>`+
    items.map(o=>`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:10px 14px;margin-bottom:6px;border-radius:10px;box-shadow:var(--shadow);">
      <span style="font-size:14px;">${o.staple_name} <span style="color:var(--text2);font-size:12px;">x${o.quantity}</span></span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:var(--text2);">${o.created_at?o.created_at.slice(11,16):''}</span>
        ${canCancel?`<button onclick="cancelOrder(${o.id},'${name}')" style="padding:4px 12px;border:1px solid #E8E8ED;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;border-radius:6px;font-family:inherit;">取消</button>`:''}
      </span>
    </div>`).join('');
}

async function cancelOrder(orderId,customerName){
  if(!confirm('确定要取消该预订吗？'))return;
  const res=await fetch(API+'/api/daily-orders/'+orderId+'?customer_name='+encodeURIComponent(customerName),{method:'DELETE'});
  const data=await res.json();
  if(!res.ok){toast(data.detail||'取消失败');return;}
  toast('已取消');
  loadMyOrders();
}

// 菜单

async function loadMenu(){
  const monday = getMonday(new Date());
  const wk=[monday.getFullYear(),String(monday.getMonth()+1).padStart(2,'0'),String(monday.getDate()).padStart(2,'0')].join('-');
  document.getElementById('weekLabel').textContent=weekLabel(monday);
  try{
    const res=await fetch(API+'/api/menus?week_key='+wk);
    const data=await res.json();
    if(data.detail){document.getElementById('menuList').innerHTML='<div class="empty">该周暂无菜单</div>';return;}
    renderMenu(data);
  }catch(e){document.getElementById('menuList').innerHTML='<div class="empty">加载失败</div>';}
}

function dishRowHTML(dish) {
  const tag = dish.cuisine==='川菜'?'tag-sichuan':'tag-other';
  return `<div class="dish-row"><div class="dish-info"><span>${dish.name}</span></div><span class="dish-tag ${tag}">${dish.cuisine}</span></div>`;
}

function renderMenu(data){
  const tag=dish=>dish.cuisine==='川菜'?'tag-sichuan':'tag-other';
  // 统计摘要
  let sichuan=0,total=0,wdays=0;
  data.days.forEach(day=>{if(day.is_holiday||!day.dishes)return;wdays++;const d=day.dishes;[d.bigMeat,d.otherMeat,d.vegetables,[d.soup,d.noodle]].flat().filter(Boolean).forEach(dish=>{total++;if(dish.cuisine==='川菜')sichuan++;});});
  document.getElementById('menuSummary').innerHTML=`<span>工作日 <b>${wdays}</b> 天</span><span>共 <b>${total}</b> 道菜</span><span>川菜 <b>${Math.round(sichuan/total*100)}%</b></span>`;

  document.getElementById('menuList').innerHTML=data.days.map(day=>{
    if(day.is_holiday)return`<div class="day-card holiday"><div class="day-header"><span class="day-name">${day.day_name}</span><span class="day-date">${day.date.slice(5)}</span></div><div class="holiday-notice">节假日休息</div></div>`;
    const d=day.dishes;if(!d)return'';
    let h='';
    const allMeat=[...(d.bigMeat||[]),...(d.otherMeat||[])];
    if(allMeat.length)h+=`<div class="dish-section"><div class="section-label">🥩 荤菜</div>${allMeat.map(dishRowHTML).join('')}</div>`;
    if(d.vegetables&&d.vegetables.length)h+=`<hr class="divider"><div class="dish-section"><div class="section-label">🥬 素菜</div>${d.vegetables.map(dishRowHTML).join('')}</div>`;
    if(d.soup)h+=`<hr class="divider"><div class="dish-section"><div class="section-label">🥣 汤品</div>${dishRowHTML(d.soup)}</div>`;
    if(d.noodle)h+=`<div class="dish-section"><div class="section-label">🍜 面食</div>${dishRowHTML(d.noodle)}</div>`;
    return`<div class="day-card"><div class="day-header"><span class="day-name">${day.day_name}</span><span class="day-date">${day.date.slice(5)}</span></div><div class="day-body">${h}</div></div>`;
  }).join('');
}

// ===== 每日菜单 + 评分 =====
async function loadDailyMenu(){
  const now = new Date();
  const todayStr = [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
  const weekDays = ['日','一','二','三','四','五','六'];
  document.getElementById('dailyDateLabel').textContent = todayStr + ' 星期' + weekDays[now.getDay()];

  const dow = now.getDay();
  if (dow === 0 || dow === 6) {
    document.getElementById('dailyMenuList').innerHTML = '<div class="daily-empty">🏖️ 周末食堂休息，无菜单</div>';
    return;
  }

  try {
    const monday = getMonday(now);
    const wk = [monday.getFullYear(),String(monday.getMonth()+1).padStart(2,'0'),String(monday.getDate()).padStart(2,'0')].join('-');
    const [menuRes, ratingRes] = await Promise.all([
      fetch(API+'/api/menus?week_key='+wk),
      fetch(API+'/api/ratings/'+todayStr)
    ]);
    const menuData = await menuRes.json();
    const ratings = await ratingRes.json();

    // 构建评分映射 {dish_name: {avg_score, count}}
    const ratingMap = {};
    ratings.forEach(r => { ratingMap[r.dish_name] = r; });

    const today = menuData.days ? menuData.days.find(d => d.date === todayStr) : null;
    if (!today || today.is_holiday || !today.dishes) {
      document.getElementById('dailyMenuList').innerHTML = '<div class="daily-empty">今日暂无菜单</div>';
      return;
    }

    const d = today.dishes;
    const allMeat = [...(d.bigMeat||[]), ...(d.otherMeat||[])];
    const allDishes = [
      ...(allMeat.length ? allMeat.map(m => ({...m, section:'🥩 荤菜'})) : []),
      ...(d.vegetables||[]).map(v => ({...v, section:'🥬 素菜'})),
      ...(d.soup ? [{...d.soup, section:'🥣 汤品'}] : []),
      ...(d.noodle ? [{...d.noodle, section:'🍜 面食'}] : [])
    ];

    // 重置待提交评分
    pendingRatings = {};
    window._dailyDate = todayStr;

    let html = '';
    let lastSection = '';
    allDishes.forEach((dish, idx) => {
      if (dish.section !== lastSection) {
        if (lastSection) html += '<div style="height:8px;"></div>';
        html += `<div style="font-size:13px;font-weight:700;color:var(--primary);padding:0 4px 6px;letter-spacing:1px;">${dish.section}</div>`;
        lastSection = dish.section;
      }
      const r = ratingMap[dish.name];
      const avg = r ? r.avg_score : 0;
      const count = r ? r.count : 0;
      const stars = ratingToStars(avg);
      const tag = dish.cuisine==='川菜'?'tag-sichuan':'tag-other';
      const safeName = dish.name.replace(/'/g,"\\'").replace(/"/g,'&quot;');
      html += `<div class="daily-dish-card" id="dish-${idx}">
        <div class="daily-dish-info">
          <div class="daily-dish-name">${dish.name}</div>
          <div class="daily-dish-meta">
            <span class="daily-dish-tag ${tag}">${dish.cuisine}</span>
            ${avg > 0 ? `<span class="daily-dish-avg">${stars} ${avg}（${count}人评）</span>` : '<span class="daily-dish-avg">暂无评分</span>'}
          </div>
        </div>
        <div class="daily-rating-area" data-dish="${safeName}">
          ${[1,2,3,4,5].map(s => `<span class="daily-star" data-score="${s}" onclick="pickStar('${safeName}',${s},this)">★</span>`).join('')}
        </div>
      </div>`;
    });

    // 提交按钮 / 已提交提示
    const alreadySubmitted = isSubmittedToday();
    if (alreadySubmitted) {
      html += `<div style="padding:20px 0 8px;text-align:center;">
        <div style="font-size:15px;color:var(--primary);font-weight:700;">✅ 今日已提交评分</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px;">每人每天仅限评分一次</div>
      </div>`;
    } else {
      html += `<div style="padding:16px 0 8px;">
        <button class="btn-submit" onclick="submitAllRatings()" id="dailySubmitBtn" style="opacity:0.5;">⭐ 提交评分</button>
        <div style="text-align:center;font-size:11px;color:var(--text2);margin-top:6px;" id="dailySubmitHint">先选星星，再统一提交</div>
      </div>`;
    }

    document.getElementById('dailyMenuList').innerHTML = html;

  } catch(e) {
    document.getElementById('dailyMenuList').innerHTML = '<div class="daily-empty">加载失败，下拉刷新重试</div>';
  }
}

// 设备标识（存 localStorage，用于限制每人每天仅提交一次）
function getDeviceId(){
  let id = localStorage.getItem('canteen_device_id');
  if (!id) {
    id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('canteen_device_id', id);
  }
  return id;
}

function todayKey(){ return new Date().toISOString().slice(0,10); }

function isSubmittedToday(){
  return localStorage.getItem('rated_' + todayKey()) === '1';
}

function markSubmittedToday(){
  localStorage.setItem('rated_' + todayKey(), '1');
}

// 待提交的评分缓存 {dishName: score}
let pendingRatings = {};

function pickStar(dishName, score, el){
  // 高亮选中星星
  const parent = el.parentElement;
  parent.querySelectorAll('.daily-star').forEach((s, i) => {
    s.classList.toggle('active', i < score);
  });

  // 缓存评分
  if (score > 0) {
    pendingRatings[dishName] = score;
  } else {
    delete pendingRatings[dishName];
  }

  // 点亮提交按钮
  const btn = document.getElementById('dailySubmitBtn');
  const hint = document.getElementById('dailySubmitHint');
  const count = Object.keys(pendingRatings).length;
  if (count > 0) {
    btn.style.opacity = '1';
    hint.textContent = '已选 ' + count + ' 道菜，点击提交';
  } else {
    btn.style.opacity = '0.5';
    hint.textContent = '先选星星，再统一提交';
  }
}

async function submitAllRatings(){
  const date = window._dailyDate;
  const deviceId = getDeviceId();
  const items = Object.entries(pendingRatings).map(([dishName, score]) => ({
    dish_name: dishName,
    menu_date: date,
    score: score,
    nickname: '食客',
    device_id: deviceId
  }));

  if (items.length === 0) {
    toast('请先给菜品打分');
    return;
  }

  const btn = document.getElementById('dailySubmitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const res = await fetch(API+'/api/ratings/batch', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(items)
    });
    if (res.ok) {
      markSubmittedToday();
      toast('已提交 ' + items.length + ' 道菜的评分');
      pendingRatings = {};
      setTimeout(() => loadDailyMenu(), 600);
    } else if (res.status === 409) {
      markSubmittedToday();
      toast('今日已提交过，每人每天仅限一次');
      setTimeout(() => loadDailyMenu(), 600);
    } else {
      const data = await res.json();
      toast(data.detail || '提交失败');
      btn.disabled = false;
      btn.textContent = '⭐ 提交评分';
    }
  } catch(e) {
    toast('网络错误，请重试');
    btn.disabled = false;
    btn.textContent = '⭐ 提交评分';
  }
}

// 每日菜单下拉刷新
(function(){
  let dailyStartY=0, dailyPulling=false, dailyMoved=false;
  const dailyHint = document.createElement('div');
  dailyHint.style.cssText = 'text-align:center;font-size:13px;color:var(--text2);padding:8px;opacity:0;transition:opacity 0.2s;';
  const dailyPage = document.getElementById('page-daily');
  if (dailyPage) {
    dailyPage.querySelector('.daily-date-label').after(dailyHint);
  }

  document.addEventListener('touchstart', e => {
    if (!document.getElementById('page-daily').classList.contains('active')) return;
    if (document.documentElement.scrollTop <= 5) {
      dailyStartY = e.touches[0].clientY;
      dailyPulling = true;
      dailyMoved = false;
    }
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if (!dailyPulling) return;
    const dy = e.touches[0].clientY - dailyStartY;
    if (dy > 10) {
      dailyMoved = true;
      dailyHint.style.opacity = dy > 60 ? '1' : String(dy/60*0.7);
      dailyHint.textContent = dy > 60 ? '释放刷新' : '↓ 下拉刷新';
    }
  }, {passive:true});

  document.addEventListener('touchend', () => {
    if (!dailyPulling) return;
    if (dailyMoved && document.documentElement.scrollTop <= 5) {
      dailyHint.textContent = '刷新中...';
      dailyHint.style.opacity = '1';
      loadDailyMenu().finally(() => { dailyHint.style.opacity = '0'; });
    }
    dailyPulling = false; dailyMoved = false; dailyStartY = 0;
  });
})();

// 意见箱
async function submitFeedback(){
  const nickname=document.getElementById('fbNickname').value.trim()||'匿名';
  const type=document.getElementById('fbType').value;
  const content=document.getElementById('fbContent').value.trim();
  if(!content){toast('请输入内容');return;}
  await fetch(API+'/api/feedbacks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname,type,content})});
  document.getElementById('fbContent').value='';toast('提交成功');
}
async function loadMyFeedbacks(){
  const nickname=document.getElementById('fbSearchNick').value.trim();
  if(!nickname){toast('请输入昵称');return;}
  const res=await fetch(API+'/api/feedbacks?nickname='+encodeURIComponent(nickname));
  const items=await res.json();
  if(!items.length){document.getElementById('fbList').innerHTML='<div class="empty">没有找到相关反馈</div>';return;}
  const typeNames={suggestion:'建议',complaint:'投诉',praise:'表扬'};
  const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
  document.getElementById('fbList').innerHTML=items.map(f=>`<div class="fb-card"><div class="meta"><span>${esc(typeNames[f.type]||f.type)}</span><span>${f.created_at?f.created_at.slice(0,10):''}</span><span class="badge ${f.status==='pending'?'badge-pending':'badge-replied'}">${f.status==='pending'?'处理中':'已回复'}</span></div><div class="content">${esc(f.content)}</div>${f.reply?`<div class="reply">回复：${esc(f.reply)}</div>`:''}</div>`).join('');
}

// 下拉刷新（菜单页）
(function(){
  let startY=0,pulling=false,moved=false;
  const threshold=60,hint=document.createElement('div');
  hint.style.cssText='text-align:center;font-size:13px;color:var(--text2);padding:0 0 8px;opacity:0;transition:opacity 0.2s;';
  document.getElementById('page-menu').querySelector('.menu-summary').after(hint);

  function scrollTop(){return document.documentElement.scrollTop||document.body.scrollTop;}
  document.addEventListener('touchstart',e=>{if(scrollTop()<=5){startY=e.touches[0].clientY;pulling=true;moved=false;}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!pulling)return;const dy=e.touches[0].clientY-startY;if(dy>10){moved=true;hint.style.opacity=dy>threshold?'1':String(dy/threshold*0.7);hint.textContent=dy>threshold?'释放刷新':'↓ 下拉刷新';}},{passive:true});
  document.addEventListener('touchend',()=>{if(!pulling)return;if(moved&&scrollTop()<=5){hint.textContent='刷新中...';hint.style.opacity='1';loadMenu().finally(()=>{hint.style.opacity='0';});}pulling=false;moved=false;startY=0;});
})();

// Init
updateWelcome();
loadHomeStats();
loadMenu();
</script>
