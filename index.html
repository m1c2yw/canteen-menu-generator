<html lang="zh-CN">

<style>
  :root {
    --bg: #f5f0eb;
    --card-bg: #fff;
    --text: #2c2416;
    --text-secondary: #6b5e4a;
    --border: #e8ddd0;
    --chicken: #e74c3c;
    --duck: #e67e22;
    --beef: #c0392b;
    --shrimp: #d35400;
    --vegetable: #27ae60;
    --soup: #2980b9;
    --noodle: #8e44ad;
    --sichuan: #e74c3c;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 12px;
    --toast-bg: #2c2416;
    --tag-sichuan-bg: #fde8e8;
    --tag-other-bg: #e8f0fe;
  }

  [data-theme="dark"] {
    --bg: #1a1a2e;
    --card-bg: #252540;
    --text: #e8e8e8;
    --text-secondary: #a0a0b8;
    --border: #3a3a55;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --toast-bg: #444;
    --tag-sichuan-bg: #3d1a1a;
    --tag-other-bg: #1a2a3d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
  }

  [data-theme="dark"] .header {
    background: linear-gradient(135deg, #8b1a1a, #a52828);
  }
  [data-theme="dark"] .btn-outline {
    background: var(--card-bg);
    color: var(--text);
    border-color: var(--border);
  }
  [data-theme="dark"] .btn-outline:hover { border-color: #e74c3c; color: #e74c3c; }
  [data-theme="dark"] .btn-ghost { color: var(--text-secondary); }
  [data-theme="dark"] .btn-ghost:hover { background: var(--card-bg); }
  [data-theme="dark"] .summary-item,
  [data-theme="dark"] .day-card { background: var(--card-bg); }
  [data-theme="dark"] .day-header { background: linear-gradient(135deg, #8b1a1a, #a04000); }
  [data-theme="dark"] .day-card.holiday .day-header { background: linear-gradient(135deg, #555, #666); }
  /* ===== 顶部导航 ===== */
  .header {
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: #fff;
    padding: 20px 0;
    box-shadow: 0 2px 16px rgba(192,57,43,0.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .header-subtitle {
    font-size: 14px;
    opacity: 0.9;
    font-weight: 400;
  }

  /* ===== 周导航 ===== */
  .week-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .week-nav button {
    width: 36px; height: 36px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .week-nav button:hover {
    background: rgba(255,255,255,0.3);
    border-color: #fff;
  }
  .week-label {
    font-size: 16px;
    font-weight: 600;
    min-width: 200px;
    text-align: center;
  }

  /* ===== 主体 ===== */
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ===== 操作栏 ===== */
  .actions {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .btn-primary {
    background: #c0392b;
    color: #fff;
  }
  .btn-primary:hover { background: #a93226; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(192,57,43,0.3); }
  .btn-outline {
    background: #fff;
    color: var(--text);
    border: 2px solid var(--border);
  }
  .btn-outline:hover { border-color: #c0392b; color: #c0392b; }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { background: #fff; border-color: var(--border); }

  /* ===== 统计摘要 ===== */
  .summary {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .summary-item {
    background: #fff;
    border-radius: var(--radius);
    padding: 14px 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .summary-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .summary-dot.sichuan { background: var(--chicken); }
  .summary-dot.other { background: var(--soup); }
  .summary-count {
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
  }

  /* ===== 菜单网格 ===== */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }

  @media (max-width: 1000px) {
    .menu-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .menu-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .menu-grid { grid-template-columns: 1fr; }
  }

  /* ===== 每日卡片 ===== */
  .day-card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .day-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
  .day-card.today {
    outline: 2px solid #c0392b;
    outline-offset: -2px;
    box-shadow: var(--shadow);
  }

  .day-header {
    background: linear-gradient(135deg, #c0392b, #d35400);
    color: #fff;
    padding: 12px 14px;
    text-align: center;
  }
  .day-card.holiday { opacity: 0.6; }
  .day-card.holiday .day-header {
    background: linear-gradient(135deg, #95a5a6, #7f8c8d);
  }
  .day-card.holiday .holiday-notice {
    text-align: center;
    padding: 32px 12px;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 600;
  }
  .day-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .day-date {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .day-body {
    padding: 10px 12px 14px;
  }

  .dish-group {
    margin-bottom: 8px;
  }
  .dish-group:last-child { margin-bottom: 0; }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .group-label .icon {
    width: 16px; height: 16px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
  }
  .icon.chicken { background: var(--chicken); }
  .icon.duck { background: var(--duck); }
  .icon.beef { background: var(--beef); }
  .icon.shrimp { background: var(--shrimp); }
  .icon.fish { background: #2980b9; }
  .icon.otherMeat { background: #e67e22; }
  .icon.vegetable { background: var(--vegetable); }
  .icon.soup { background: var(--soup); }
  .icon.noodle { background: var(--noodle); }

  .dish-list {
    list-style: none;
  }
  .dish-item {
    font-size: 13px;
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.5;
  }
  .dish-name {
    flex: 1;
  }
  .dish-tag {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .tag-sichuan {
    background: var(--tag-sichuan-bg);
    color: #c0392b;
  }
  [data-theme="dark"] .tag-sichuan { color: #e88; }
  .tag-other {
    background: var(--tag-other-bg);
    color: #2980b9;
  }
  [data-theme="dark"] .tag-other { color: #8bf; }

  /* ===== 分隔线 ===== */
  .divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 8px 0;
  }

  /* ===== 页脚 ===== */
  .footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  /* ===== 打印样式 ===== */
  @media print {
    body { background: #fff; }
    [data-theme="dark"] body { background: #fff; }
    .day-card, .summary-item { background: #fff !important; }
    [data-theme="dark"] .day-card,
    [data-theme="dark"] .summary-item { background: #fff !important; }
    .day-card.today { outline: 2px solid #c0392b; }
    .header { background: #c0392b !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .actions, .week-nav button { display: none; }
    .menu-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .day-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
    .day-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ===== Toast 提示 ===== */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toast-bg);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>

  <!-- 统计 -->

  <!-- 菜单网格 -->
  <div class="menu-grid" id="menuGrid"></div>

</main>

<!-- 页脚 -->

/** 检查指定日期是否为节假日 */
function isHoliday(date) {
  return HOLIDAYS.has(formatDate(date));
}

/** 检查指定日期是否为工作日（周一至周五且非法定节假日） */
function isWorkday(date) {
  const day = date.getDay();
  return day >= 1 && day <= 5 && !isHoliday(date);
}

//  工具函数
// ============================================================

/** Fisher-Yates 洗牌 */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** 获取指定日期所在周的周一 */
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

/** 格式化日期 YYYY-MM-DD */
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

/** 获取周几的中文名 */
function getDayName(date) {
  const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return names[date.getDay()];
}

/** 获取周数 */
function getWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

/** 获取周五的日期字符串 */
function getWeekEndDate(monday) {
  return formatDate(new Date(monday.getTime() + 4 * 86400000));
}

/** 获取菜系标签 CSS 类名 */
function cuisineTagClass(dish) {
  return dish.cuisine === '川菜' ? 'tag-sichuan' : 'tag-other';
}

// ============================================================
//  8周冷却追踪（控制重复率 ≤20%）
// ============================================================

const HISTORY_WEEKS = 8;
const HISTORY_KEY = 'dish_history';

function getDishHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); }
  catch { return {}; }
}

/** 获取最近8周内出现过的所有菜名 */
function getRecentDishSet() {
  const history = getDishHistory();
  const recent = new Set();
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - HISTORY_WEEKS * 7);
  for (const [weekKey, dishes] of Object.entries(history)) {
    if (new Date(weekKey) >= cutoff) {
      dishes.forEach(d => recent.add(d));
    }
  }
  return recent;
}

/** 洗牌并优先排列未出现过的菜品 */
function shuffleWithCooldown(arr, recentSet) {
  const fresh = arr.filter(d => !recentSet.has(d.name));
  const used = arr.filter(d => recentSet.has(d.name));
  return [...shuffle(fresh), ...shuffle(used)];
}

/** 保存本周所用菜品到历史记录 */
function saveWeekDishes(weekKey, dishNames) {
  const history = getDishHistory();
  history[weekKey] = dishNames;
  // 清理8周前的记录
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - HISTORY_WEEKS * 7);
  for (const key of Object.keys(history)) {
    if (new Date(key) < cutoff) delete history[key];
  }
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

// ============================================================
//  状态管理
// ============================================================

let currentMonday = getMonday(new Date());
let currentMenu = null;

/** 从大荤候选中选2种，确保鸡鸭不同时出现 */
function pickBigMeatKeys(mustInclude) {
  const nonFish = BIG_MEAT_KEYS.filter(k => k !== 'fish');
  if (mustInclude === 'fish') {
    const other = shuffle(nonFish)[0];
    return ['fish', other];
  }
  // 非鱼日：从非鱼类中选2种，避免鸡鸭同在
  const shuffled = shuffle([...nonFish]);
  const a = shuffled[0], b = shuffled[1];
  if ((a === 'chicken' && b === 'duck') || (a === 'duck' && b === 'chicken')) {
    return [a, shuffled[2]];
  }
  return [a, b];
}

/** 生成一周菜单（周一至周五，法定节假日除外） */
function generateWeeklyMenu(mondayDate) {
  const weekKey = formatDate(mondayDate);

  const cached = localStorage.getItem(`menu_${weekKey}`);
  if (cached) return JSON.parse(cached);

  // 8周冷却：优先使用未出现的菜品
  const recentSet = getRecentDishSet();

  // 洗牌所有池（冷却优先）
  const pools = {};
  for (const [key, dishes] of Object.entries(DISH_DB)) {
    pools[key] = shuffleWithCooldown(dishes, recentSet);
  }

  const bigIndices = {};
  BIG_MEAT_KEYS.forEach(k => { bigIndices[k] = 0; });
  const otherIndices = { otherMeat: 0, lamb: 0, vegetable: 0, soup: 0, noodle: 0 };

  // 预扫描本周有多少个工作日
  let workdayCount = 0;
  for (let i = 0; i < 7; i++) {
    const dow = (mondayDate.getDay() + i) % 7;
    if (dow === 0 || dow === 6) continue;
    const d = new Date(mondayDate); d.setDate(d.getDate() + i);
    if (!isHoliday(d)) workdayCount++;
  }
  if (workdayCount === 0) workdayCount = 1;

  // 鱼：每周恰好一次，随机选一个工作日
  const fishDay = Math.floor(Math.random() * workdayCount);

  // 羊：每半月一次（距上次 >= 14 天）
  const lastLamb = localStorage.getItem('last_lamb_date');
  let allowLamb = !lastLamb;
  if (lastLamb) {
    const daysSince = Math.floor((mondayDate.getTime() - new Date(lastLamb).getTime()) / 86400000);
    allowLamb = daysSince >= 14;
  }
  const lambDay = allowLamb ? Math.floor(Math.random() * workdayCount) : -1;

  const week = [];
  let wdIdx = 0; // 工作日序号

  for (let i = 0; i < 7; i++) {
    const dayOfWeek = (mondayDate.getDay() + i) % 7;
    if (dayOfWeek === 0 || dayOfWeek === 6) continue;

    const date = new Date(mondayDate);
    date.setDate(date.getDate() + i);
    const dateStr = formatDate(date);

    if (isHoliday(date)) {
      week.push({ date: dateStr, dayName: getDayName(date), isHoliday: true, dishes: null });
      wdIdx++;
      continue;
    }

    // 大荤选择
    const bigKeys = pickBigMeatKeys(wdIdx === fishDay ? 'fish' : null);
    const bigMeatDishes = bigKeys.map(key => ({
      ...pools[key][bigIndices[key]++],
      meatType: key,
    }));

    // 其他荤菜：羊肉日 1羊+1猪，非羊肉日 2猪
    let otherMeatDishes;
    if (wdIdx === lambDay) {
      otherMeatDishes = [
        { ...pools.lamb[otherIndices.lamb++], meatType: 'lamb' },
        pools.otherMeat[otherIndices.otherMeat++],
      ];
      localStorage.setItem('last_lamb_date', dateStr);
    } else {
      otherMeatDishes = [
        pools.otherMeat[otherIndices.otherMeat++],
        pools.otherMeat[otherIndices.otherMeat++],
      ];
    }

    const day = {
      date: dateStr,
      dayName: getDayName(date),
      isHoliday: false,
      dishes: {
        bigMeat: bigMeatDishes,
        otherMeat: otherMeatDishes,
        vegetables: [
          pools.vegetable[otherIndices.vegetable++],
          pools.vegetable[otherIndices.vegetable++],
          pools.vegetable[otherIndices.vegetable++],
        ],
        soup: pools.soup[otherIndices.soup++],
        noodle: pools.noodle[otherIndices.noodle++],
      },
    };

    week.push(day);
    wdIdx++;
  }

  // 收集本周所有菜名，存入冷却历史
  const allNames = [];
  week.forEach(day => {
    if (day.isHoliday || !day.dishes) return;
    const d = day.dishes;
    d.bigMeat.forEach(m => allNames.push(m.name));
    d.otherMeat.forEach(m => allNames.push(m.name));
    d.vegetables.forEach(v => allNames.push(v.name));
    allNames.push(d.soup.name, d.noodle.name);
  });
  saveWeekDishes(weekKey, allNames);

  localStorage.setItem(`menu_${weekKey}`, JSON.stringify(week));
  return week;
}

/** 强制重新生成（清除缓存和历史后生成） */
function forceRegenerate(mondayDate) {
  const weekKey = formatDate(mondayDate);
  localStorage.removeItem(`menu_${weekKey}`);
  const history = getDishHistory();
  delete history[weekKey];
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  return generateWeeklyMenu(mondayDate);
}

// ============================================================
//  渲染
// ============================================================

/** 渲染完整页面 */
function render() {
  currentMenu = generateWeeklyMenu(currentMonday);
  renderWeekLabel();
  renderSummary();
  renderMenuGrid();
}

/** 渲染周标签 */
function renderWeekLabel() {
  const weekNum = getWeekNumber(currentMonday);
  const year = currentMonday.getFullYear();
  document.getElementById('weekLabel').textContent = `${year}年 第${weekNum}周`;
}

/** 渲染统计摘要 */
function renderSummary() {
  let sichuanCount = 0;
  let otherCount = 0;
  let workdayCount = 0;
  let holidayCount = 0;

  currentMenu.forEach(day => {
    if (day.isHoliday) {
      holidayCount++;
      return;
    }
    workdayCount++;
    const d = day.dishes;
    const allDishes = [
      ...d.bigMeat, ...d.otherMeat,
      ...d.vegetables, d.soup, d.noodle,
    ];
    allDishes.forEach(dish => {
      if (dish.cuisine === '川菜') sichuanCount++;
      else otherCount++;
    });
  });

  document.getElementById('summary').innerHTML = `
    <div class="summary-item">
      <span class="summary-dot sichuan"></span>
      川菜 <span class="summary-count">${sichuanCount}</span> 道
    </div>
    <div class="summary-item">
      <span class="summary-dot other"></span>
      其他地方菜 <span class="summary-count">${otherCount}</span> 道
    </div>
    <div class="summary-item">
      📅 ${formatDate(currentMonday)} ~ ${getWeekEndDate(currentMonday)} · 工作日 <span class="summary-count">${workdayCount}</span> 天
    </div>
    ${holidayCount > 0 ? `
    <div class="summary-item">
      🏖️ 节假日 <span class="summary-count">${holidayCount}</span> 天休息
    </div>` : ''}
  `;
}

/** 渲染菜单网格 */
function renderMenuGrid() {
  const grid = document.getElementById('menuGrid');
  const today = formatDate(new Date());

  grid.innerHTML = currentMenu.map(day => {
    const isToday = day.date === today;

    if (day.isHoliday) {
      return `
        <div class="day-card holiday">
          <div class="day-header">
            <div class="day-name">${day.dayName}</div>
            <div class="day-date">${day.date.slice(5)}</div>
          </div>
          <div class="holiday-notice">🏖️<br>节假日休息</div>
        </div>
      `;
    }

    const d = day.dishes;
    return `
      <div class="day-card ${isToday ? 'today' : ''}">
        <div class="day-header">
          <div class="day-name">${day.dayName}</div>
          <div class="day-date">${day.date.slice(5)}</div>
        </div>
        <div class="day-body">
          ${renderMeatGroup(d.bigMeat, d.otherMeat)}
          <hr class="divider">
          ${renderVegGroup(d.vegetables)}
          <hr class="divider">
          ${renderSingleGroup('soup', d.soup)}
          ${renderSingleGroup('noodle', d.noodle)}
        </div>
      </div>
    `;
  }).join('');
}

function renderMeatGroup(bigMeat, otherMeat) {
  const allMeat = [
    ...bigMeat.map(d => ({ ...d, isBig: true })),
    ...otherMeat.map(d => ({ ...d, isBig: false })),
  ];
  return `
    <div class="dish-group">
      <div class="group-label">🥩 荤菜</div>
      <ul class="dish-list">
        ${allMeat.map(d => `
          <li class="dish-item">
            <span class="dish-name">${MEAT_ICONS[d.meatType || d.protein || 'pork']} ${d.name}</span>
            <span class="dish-tag ${cuisineTagClass(d)}">${d.cuisine}</span>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function renderVegGroup(dishes) {
  return `
    <div class="dish-group">
      <div class="group-label">
        <span class="icon vegetable">🥬</span> 素菜
      </div>
      <ul class="dish-list">
        ${dishes.map(d => `
          <li class="dish-item">
            <span class="dish-name">${d.name}</span>
            <span class="dish-tag ${cuisineTagClass(d)}">${d.cuisine}</span>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function renderSingleGroup(key, dish) {
  const icon = DISH_ICONS[key];
  const label = key === 'soup' ? '汤品' : '面食';
  return `
    <div class="dish-group">
      <div class="group-label">
        <span class="icon ${key}">${icon}</span> ${label}
      </div>
      <ul class="dish-list">
        <li class="dish-item">
          <span class="dish-name">${dish.name}</span>
          <span class="dish-tag ${cuisineTagClass(dish)}">${dish.cuisine}</span>
        </li>
      </ul>
    </div>
  `;
}

// ============================================================
//  操作
// ============================================================

/** 切换周 */
function navigateWeek(delta) {
  currentMonday.setDate(currentMonday.getDate() + delta * 7);
  render();
}

/** 回到本周 */
function goToCurrentWeek() {
  currentMonday = getMonday(new Date());
  render();
}

/** 重新生成 */
function regenerateMenu() {
  forceRegenerate(currentMonday);
  render();
  showToast('已重新生成本周菜单 ✅');
}

/** 打印 */
function printMenu() {
  window.print();
}

/** 导出图片 */
function exportImage() {
  showToast('请使用浏览器的截图工具或按 Ctrl+P 打印为 PDF');
}

/** Toast */
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

const THEME_LIST = ['light', 'dark'];

/** 应用主题 */
function applyTheme(theme) {
  const html = document.documentElement;
  if (theme === 'dark') {
    html.setAttribute('data-theme', 'dark');
  } else {
    html.removeAttribute('data-theme');
  }
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('menu_theme', theme);
}

/** 深色模式切换 */
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const currentTheme = current === 'dark' ? 'dark' : 'light';
  const idx = THEME_LIST.indexOf(currentTheme);
  const next = THEME_LIST[(idx + 1) % THEME_LIST.length];
  applyTheme(next);
}

/** 初始化主题 */
function initTheme() {
  const saved = localStorage.getItem('menu_theme');
  if (saved) applyTheme(saved);
}

/** 复制菜单文本 */
function copyMenuText() {
  if (!currentMenu) {
    showToast('菜单尚未生成，请稍后重试');
    return;
  }
  let text = `📋 食堂周菜单 (${formatDate(currentMonday)} ~ ${getWeekEndDate(currentMonday)})\n`;
  text += '═'.repeat(40) + '\n\n';

  currentMenu.forEach(day => {
    if (day.isHoliday) return;
    const d = day.dishes;
    text += `【${day.dayName} ${day.date.slice(5)}】\n`;
    text += `  🥩 荤菜：\n`;
    d.bigMeat.forEach(m => { text += `    ${MEAT_ICONS[m.meatType]} ${MEAT_LABELS[m.meatType]}：${m.name}（${m.cuisine}）\n`; });
    d.otherMeat.forEach(m => {
      const mt = m.meatType || m.protein || 'pork';
      text += `    ${MEAT_ICONS[mt] || '🐖'} ${MEAT_LABELS[mt] || '肉类'}：${m.name}（${m.cuisine}）\n`;
    });
    text += `  🥬 素菜：${d.vegetables.map(v => v.name).join('、')}\n`;
    text += `  🥣 汤品：${d.soup.name}\n`;
    text += `  🍜 面食：${d.noodle.name}\n`;
    text += '\n';
  });

  navigator.clipboard.writeText(text).then(() => {
    showToast('菜单已复制到剪贴板 ✅');
  }).catch((err) => {
    console.error('复制菜单失败:', err);
    showToast('复制失败，请重试');
  });
}

// ============================================================
//  启动
// ============================================================

initTheme();
render();
</script>
