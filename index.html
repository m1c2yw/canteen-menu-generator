<html lang="zh-CN">

<style>
  :root {
    --bg: #f5f0eb;
    --card-bg: #fff;
    --text: #2c2416;
    --text-secondary: #6b5e4a;
    --border: #e8ddd0;
    --chicken: #e74c3c;
    --duck: #e67e22;
    --beef: #c0392b;
    --shrimp: #d35400;
    --vegetable: #27ae60;
    --soup: #2980b9;
    --noodle: #8e44ad;
    --sichuan: #e74c3c;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 12px;
    --toast-bg: #2c2416;
    --tag-sichuan-bg: #fde8e8;
    --tag-other-bg: #e8f0fe;
  }

  [data-theme="dark"] {
    --bg: #1a1a2e;
    --card-bg: #252540;
    --text: #e8e8e8;
    --text-secondary: #a0a0b8;
    --border: #3a3a55;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --toast-bg: #444;
    --tag-sichuan-bg: #3d1a1a;
    --tag-other-bg: #1a2a3d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background 0.3s, color 0.3s;
  }

  [data-theme="dark"] .header {
    background: linear-gradient(135deg, #8b1a1a, #a52828);
  }
  [data-theme="dark"] .btn-outline {
    background: var(--card-bg);
    color: var(--text);
    border-color: var(--border);
  }
  [data-theme="dark"] .btn-outline:hover { border-color: #e74c3c; color: #e74c3c; }
  [data-theme="dark"] .btn-ghost { color: var(--text-secondary); }
  [data-theme="dark"] .btn-ghost:hover { background: var(--card-bg); }
  [data-theme="dark"] .summary-item,
  [data-theme="dark"] .day-card { background: var(--card-bg); }
  [data-theme="dark"] .day-header { background: linear-gradient(135deg, #8b1a1a, #a04000); }
  [data-theme="dark"] .day-header.weekend { background: linear-gradient(135deg, #a0501a, #b87020); }
  /* ===== 顶部导航 ===== */
  .header {
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: #fff;
    padding: 20px 0;
    box-shadow: 0 2px 16px rgba(192,57,43,0.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .header-subtitle {
    font-size: 14px;
    opacity: 0.9;
    font-weight: 400;
  }

  /* ===== 周导航 ===== */
  .week-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .week-nav button {
    width: 36px; height: 36px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .week-nav button:hover {
    background: rgba(255,255,255,0.3);
    border-color: #fff;
  }
  .week-label {
    font-size: 16px;
    font-weight: 600;
    min-width: 200px;
    text-align: center;
  }

  /* ===== 主体 ===== */
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ===== 操作栏 ===== */
  .actions {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .btn-primary {
    background: #c0392b;
    color: #fff;
  }
  .btn-primary:hover { background: #a93226; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(192,57,43,0.3); }
  .btn-outline {
    background: #fff;
    color: var(--text);
    border: 2px solid var(--border);
  }
  .btn-outline:hover { border-color: #c0392b; color: #c0392b; }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { background: #fff; border-color: var(--border); }

  /* ===== 统计摘要 ===== */
  .summary {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .summary-item {
    background: #fff;
    border-radius: var(--radius);
    padding: 14px 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .summary-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .summary-dot.sichuan { background: var(--chicken); }
  .summary-dot.other { background: var(--soup); }
  .summary-count {
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
  }

  /* ===== 菜单网格 ===== */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
  }

  @media (max-width: 1200px) {
    .menu-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 768px) {
    .menu-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .menu-grid { grid-template-columns: 1fr; }
  }

  /* ===== 每日卡片 ===== */
  .day-card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .day-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
  .day-card.today {
    outline: 2px solid #c0392b;
    outline-offset: -2px;
    box-shadow: var(--shadow);
  }

  .day-header {
    background: linear-gradient(135deg, #c0392b, #d35400);
    color: #fff;
    padding: 12px 14px;
    text-align: center;
  }
  .day-header.weekend {
    background: linear-gradient(135deg, #e67e22, #f39c12);
  }
  .day-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .day-date {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .day-body {
    padding: 10px 12px 14px;
  }

  .dish-group {
    margin-bottom: 8px;
  }
  .dish-group:last-child { margin-bottom: 0; }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .group-label .icon {
    width: 16px; height: 16px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
  }
  .icon.chicken { background: var(--chicken); }
  .icon.duck { background: var(--duck); }
  .icon.beef { background: var(--beef); }
  .icon.shrimp { background: var(--shrimp); }
  .icon.vegetable { background: var(--vegetable); }
  .icon.soup { background: var(--soup); }
  .icon.noodle { background: var(--noodle); }

  .dish-list {
    list-style: none;
  }
  .dish-item {
    font-size: 13px;
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.5;
  }
  .dish-name {
    flex: 1;
  }
  .dish-tag {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .tag-sichuan {
    background: var(--tag-sichuan-bg);
    color: #c0392b;
  }
  [data-theme="dark"] .tag-sichuan { color: #e88; }
  .tag-other {
    background: var(--tag-other-bg);
    color: #2980b9;
  }
  [data-theme="dark"] .tag-other { color: #8bf; }

  /* ===== 分隔线 ===== */
  .divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 8px 0;
  }

  /* ===== 页脚 ===== */
  .footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  /* ===== 打印样式 ===== */
  @media print {
    body { background: #fff; }
    [data-theme="dark"] body { background: #fff; }
    .day-card, .summary-item { background: #fff !important; }
    [data-theme="dark"] .day-card,
    [data-theme="dark"] .summary-item { background: #fff !important; }
    .day-card.today { outline: 2px solid #c0392b; }
    .header { background: #c0392b !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .actions, .week-nav button { display: none; }
    .menu-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
    .day-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ===== Toast 提示 ===== */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toast-bg);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>

<!-- 顶部 -->
<header class="header">

    <div>
      <h1>🍽️ 食堂菜单自动生成平台</h1>

      <button onclick="toggleTheme()" id="themeBtn" style="font-size:14px;width:auto;padding:0 10px;border-radius:16px;" title="切换深色模式">🌙</button>
    </div>
  </div>
</header>

<!-- 主体 -->
<main class="main">

  <!-- 操作按钮 -->
  <div class="actions">

    <button class="btn btn-ghost" onclick="copyMenuText()">📋 复制菜单文本</button>
  </div>

  <!-- 统计 -->
  <div class="summary" id="summary"></div>

  <!-- 菜单网格 -->
  <div class="menu-grid" id="menuGrid"></div>

</main>

<!-- 页脚 -->
<div class="footer">
  食堂菜单自动生成平台 · 菜品以川菜为主，其他地方菜为辅 · 每日保证鸡肉、鸭肉、牛肉、虾各一道
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** 获取指定日期所在周的周一 */
function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

/** 格式化日期 YYYY-MM-DD */
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

/** 获取周几的中文名 */
function getDayName(date) {
  const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return names[date.getDay()];
}

/** 获取周数 */
function getWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

/** 获取周日的日期字符串 */
function getWeekEndDate(monday) {
  return formatDate(new Date(monday.getTime() + 6 * 86400000));
}

/** 获取菜系标签 CSS 类名 */
function cuisineTagClass(dish) {
  return dish.cuisine === '川菜' ? 'tag-sichuan' : 'tag-other';
}

// ============================================================
//  状态管理
// ============================================================

let currentMonday = getMonday(new Date());
let currentMenu = null;

/** 生成一周菜单 */
function generateWeeklyMenu(mondayDate) {
  const weekKey = formatDate(mondayDate);

  // 先检查 localStorage
  const cached = localStorage.getItem(`menu_${weekKey}`);
  if (cached) {
    return JSON.parse(cached);
  }

  // 各类型洗牌
  const pools = {};
  for (const [key, dishes] of Object.entries(DISH_DB)) {
    pools[key] = shuffle(dishes);
  }

  const indices = {
    chicken: 0, duck: 0, beef: 0, shrimp: 0,
    vegetable: 0, soup: 0, noodle: 0,
  };

  const week = [];
  for (let i = 0; i < 7; i++) {
    const date = new Date(mondayDate);
    date.setDate(date.getDate() + i);

    const day = {
      date: formatDate(date),
      dayName: getDayName(date),
      isWeekend: date.getDay() === 0 || date.getDay() === 6,
      dishes: {
        chicken: pools.chicken[indices.chicken++],
        duck: pools.duck[indices.duck++],
        beef: pools.beef[indices.beef++],
        shrimp: pools.shrimp[indices.shrimp++],
        vegetables: [
          pools.vegetable[indices.vegetable++],
          pools.vegetable[indices.vegetable++],
          pools.vegetable[indices.vegetable++],
        ],
        soup: pools.soup[indices.soup++],
        noodle: pools.noodle[indices.noodle++],
      },
    };

    week.push(day);
  }

  // 存入 localStorage
  localStorage.setItem(`menu_${weekKey}`, JSON.stringify(week));
  return week;
}

/** 强制重新生成（清除缓存后生成） */
function forceRegenerate(mondayDate) {
  const weekKey = formatDate(mondayDate);
  localStorage.removeItem(`menu_${weekKey}`);
  return generateWeeklyMenu(mondayDate);
}

// ============================================================
//  渲染
// ============================================================

/** 渲染完整页面 */
function render() {
  currentMenu = generateWeeklyMenu(currentMonday);
  renderWeekLabel();
  renderSummary();
  renderMenuGrid();
}

/** 渲染周标签 */
function renderWeekLabel() {
  const weekNum = getWeekNumber(currentMonday);
  const year = currentMonday.getFullYear();
  document.getElementById('weekLabel').textContent = `${year}年 第${weekNum}周`;
}

/** 渲染统计摘要 */
function renderSummary() {
  let sichuanCount = 0;
  let otherCount = 0;

  currentMenu.forEach(day => {
    const d = day.dishes;
    const allDishes = [
      d.chicken, d.duck, d.beef, d.shrimp,
      ...d.vegetables, d.soup, d.noodle,
    ];
    allDishes.forEach(dish => {
      if (dish.cuisine === '川菜') sichuanCount++;
      else otherCount++;
    });
  });

  document.getElementById('summary').innerHTML = `
    <div class="summary-item">
      <span class="summary-dot sichuan"></span>
      川菜 <span class="summary-count">${sichuanCount}</span> 道
    </div>
    <div class="summary-item">
      <span class="summary-dot other"></span>
      其他地方菜 <span class="summary-count">${otherCount}</span> 道
    </div>
    <div class="summary-item">
      📅 日期范围：${formatDate(currentMonday)} ~ ${getWeekEndDate(currentMonday)}
    </div>
  `;
}

/** 渲染菜单网格 */
function renderMenuGrid() {
  const grid = document.getElementById('menuGrid');
  const today = formatDate(new Date());

  grid.innerHTML = currentMenu.map(day => {
    const d = day.dishes;
    const isToday = day.date === today;

    return `
      <div class="day-card ${isToday ? 'today' : ''}">
        <div class="day-header ${day.isWeekend ? 'weekend' : ''}">
          <div class="day-name">${day.dayName}</div>
          <div class="day-date">${day.date.slice(5)}</div>
        </div>
        <div class="day-body">
          ${renderMeatGroup('chicken', d.chicken, day)}
          ${renderMeatGroup('duck', d.duck, day)}
          ${renderMeatGroup('beef', d.beef, day)}
          ${renderMeatGroup('shrimp', d.shrimp, day)}
          <hr class="divider">
          ${renderVegGroup(d.vegetables)}
          <hr class="divider">
          ${renderSingleGroup('soup', d.soup)}
          ${renderSingleGroup('noodle', d.noodle)}
        </div>
      </div>
    `;
  }).join('');
}

function renderMeatGroup(key, dish) {
  const icon = MEAT_ICONS[key];
  const label = MEAT_LABELS[key];
  return `
    <div class="dish-group">
      <div class="group-label">
        <span class="icon ${key}">${icon}</span> ${label}
      </div>
      <ul class="dish-list">
        <li class="dish-item">
          <span class="dish-name">${dish.name}</span>
          <span class="dish-tag ${cuisineTagClass(dish)}">${dish.cuisine}</span>
        </li>
      </ul>
    </div>
  `;
}

function renderVegGroup(dishes) {
  return `
    <div class="dish-group">
      <div class="group-label">
        <span class="icon vegetable">🥬</span> 素菜
      </div>
      <ul class="dish-list">
        ${dishes.map(d => `
          <li class="dish-item">
            <span class="dish-name">${d.name}</span>
            <span class="dish-tag ${cuisineTagClass(d)}">${d.cuisine}</span>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function renderSingleGroup(key, dish) {
  const icon = DISH_ICONS[key];
  const label = key === 'soup' ? '汤品' : '面食';
  return `
    <div class="dish-group">
      <div class="group-label">
        <span class="icon ${key}">${icon}</span> ${label}
      </div>
      <ul class="dish-list">
        <li class="dish-item">
          <span class="dish-name">${dish.name}</span>
          <span class="dish-tag ${cuisineTagClass(dish)}">${dish.cuisine}</span>
        </li>
      </ul>
    </div>
  `;
}

// ============================================================
//  操作
// ============================================================

/** 切换周 */
function navigateWeek(delta) {
  currentMonday.setDate(currentMonday.getDate() + delta * 7);
  render();
}

/** 回到本周 */
function goToCurrentWeek() {
  currentMonday = getMonday(new Date());
  render();
}

/** 重新生成 */
function regenerateMenu() {
  forceRegenerate(currentMonday);
  render();
  showToast('已重新生成本周菜单 ✅');
}

/** 打印 */
function printMenu() {
  window.print();
}

/** 导出图片 */
function exportImage() {
  showToast('请使用浏览器的截图工具或按 Ctrl+P 打印为 PDF');
}

/** Toast */
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

const THEME_LIST = ['light', 'dark'];

/** 应用主题 */
function applyTheme(theme) {
  const html = document.documentElement;
  if (theme === 'dark') {
    html.setAttribute('data-theme', 'dark');
  } else {
    html.removeAttribute('data-theme');
  }
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('menu_theme', theme);
}

/** 深色模式切换 */
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const currentTheme = current === 'dark' ? 'dark' : 'light';
  const idx = THEME_LIST.indexOf(currentTheme);
  const next = THEME_LIST[(idx + 1) % THEME_LIST.length];
  applyTheme(next);
}

/** 初始化主题 */
function initTheme() {
  const saved = localStorage.getItem('menu_theme');
  if (saved) applyTheme(saved);
}

/** 复制菜单文本 */
function copyMenuText() {
  if (!currentMenu) {
    showToast('菜单尚未生成，请稍后重试');
    return;
  }
  let text = `📋 食堂周菜单 (${formatDate(currentMonday)} ~ ${getWeekEndDate(currentMonday)})\n`;
  text += '═'.repeat(40) + '\n\n';

  currentMenu.forEach(day => {
    const d = day.dishes;
    text += `【${day.dayName} ${day.date.slice(5)}】\n`;
    text += `  🐔 鸡肉：${d.chicken.name}（${d.chicken.cuisine}）\n`;
    text += `  🦆 鸭肉：${d.duck.name}（${d.duck.cuisine}）\n`;
    text += `  🐂 牛肉：${d.beef.name}（${d.beef.cuisine}）\n`;
    text += `  🦐 虾：   ${d.shrimp.name}（${d.shrimp.cuisine}）\n`;
    text += `  🥬 素菜：${d.vegetables.map(v => v.name).join('、')}\n`;
    text += `  🥣 汤品：${d.soup.name}\n`;
    text += `  🍜 面食：${d.noodle.name}\n`;
    text += '\n';
  });

  navigator.clipboard.writeText(text).then(() => {
    showToast('菜单已复制到剪贴板 ✅');
  }).catch((err) => {
    console.error('复制菜单失败:', err);
    showToast('复制失败，请重试');
  });
}

// ============================================================
//  启动
// ============================================================

initTheme();
render();
</script>
